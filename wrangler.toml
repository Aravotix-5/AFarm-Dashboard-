name = "afarm-api"
main = "src/worker.js"
compatibility_date = "2024-09-01"

[[d1_databases]]
binding = "DB"
database_name = "afarm"
database_id = "PASTE_YOUR_D1_DATABASE_ID_HERE"

[vars]
# Not secret — Google client IDs are public by design.
GOOGLE_CLIENT_ID = "PASTE_YOUR_GOOGLE_OAUTH_CLIENT_ID_HERE"
# Your GitHub Pages origin, e.g. "https://yourname.github.io"
ALLOWED_ORIGIN = "https://PASTE_YOUR_GITHUB_PAGES_ORIGIN_HERE"

# Set the real admin secret (never put this in a file) with:
#   wrangler secret put ADMIN_TOKEN
