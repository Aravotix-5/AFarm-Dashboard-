<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>A Farm — Orders</title>
<link rel="stylesheet" href="styles.css">
<style>
  /* Small admin-only additions — kept separate from the main site's styles.css on purpose. */
  body{ padding-top:20px; padding-bottom:40px; max-width:720px; margin:0 auto; }
  .admin-header{ padding:0 20px 12px; }
  .admin-header h1{ font-size:26px; }
  .admin-refresh{ margin:0 20px 16px; }
  .order-card{
    margin:0 20px 14px; padding:16px; border:1px solid var(--line);
    border-radius:var(--radius-md); background:var(--card); box-shadow:var(--shadow-sm);
  }
  .order-card-top{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; }
  .order-id{ font-family:'Fraunces',serif; font-weight:700; font-size:18px; }
  .order-total{ font-weight:700; }
  .order-meta{ font-size:12.5px; color:var(--ink-soft); margin:2px 0 8px; }
  .order-items{ font-size:14px; margin-bottom:10px; }
  .status-row{ display:flex; gap:6px; flex-wrap:wrap; }
  .status-chip{
    padding:8px 12px; border-radius:999px; border:1px solid var(--line);
    background:var(--linen); font-size:12.5px; font-weight:600; cursor:pointer; color:var(--ink-soft);
  }
  .status-chip.current{ background:var(--ink); color:#fff; border-color:var(--ink); }
  .empty-note{ padding:0 20px; }
  #connError{ margin:0 20px 16px; color:var(--brick-dark); font-weight:600; font-size:14px; display:none; }
</style>
</head>
<body>
  <div class="admin-header">
    <h1>A Farm — Orders</h1>
    <p class="view-sub">Tap a status to move an order forward. This page talks directly to the SQLite backend — refresh any time to see new orders.</p>
  </div>
  <button class="btn btn-ghost admin-refresh" id="refreshBtn">Refresh</button>
  <p id="connError">Can't reach the server. Check the Worker URL in this page's script and that it's deployed.</p>
  <div id="ordersList"></div>
  <p class="empty-note" id="emptyNote" hidden>No orders yet.</p>

<script>
const STATUS_PIPELINE = ["Order Received", "Preparing", "Ready", "Completed"];

/* Paste your deployed Worker URL here (same as app.js's API_BASE). */
const API_BASE = "PASTE_YOUR_WORKER_URL_HERE";
function apiUrl(path){
  return (API_BASE && !API_BASE.startsWith("PASTE_")) ? API_BASE + path : path;
}

function getAdminToken(){
  let token = localStorage.getItem("afarm_admin_token");
  if(!token){
    token = prompt("Enter the farm admin token:") || "";
    if(token) localStorage.setItem("afarm_admin_token", token);
  }
  return token;
}

function money(n){ return "$" + Number(n).toFixed(2); }

async function loadOrders(){
  const list = document.getElementById("ordersList");
  const emptyNote = document.getElementById("emptyNote");
  const connError = document.getElementById("connError");
  try{
    const res = await fetch(apiUrl("/api/orders"), {
      headers: { "Authorization": "Bearer " + getAdminToken() }
    });
    if(res.status === 401){
      localStorage.removeItem("afarm_admin_token");
      connError.textContent = "Wrong admin token — refresh to try again.";
      connError.style.display = "block";
      return;
    }
    if(!res.ok) throw new Error("bad response");
    const orders = await res.json();
    connError.style.display = "none";
    list.innerHTML = "";
    emptyNote.hidden = orders.length > 0;
    orders.forEach(o => list.appendChild(buildOrderCard(o)));
  }catch(e){
    connError.textContent = "Can't reach the server. Check the Worker URL and that it's deployed.";
    connError.style.display = "block";
  }
}

function buildOrderCard(o){
  const card = document.createElement("div");
  card.className = "order-card";

  const top = document.createElement("div");
  top.className = "order-card-top";
  top.innerHTML = '<span class="order-id">Order #' + o.id + '</span><span class="order-total">' + money(o.total) + '</span>';
  card.appendChild(top);

  const meta = document.createElement("div");
  meta.className = "order-meta";
  const who = o.customer_name ? o.customer_name + (o.customer_phone ? " · " + o.customer_phone : "") : "Anonymous customer";
  const when = new Date(o.created_at).toLocaleString();
  meta.textContent = who + " · " + when + " · +" + o.points_earned + " pts";
  card.appendChild(meta);

  const items = document.createElement("div");
  items.className = "order-items";
  items.textContent = o.items_summary;
  card.appendChild(items);

  const statusRow = document.createElement("div");
  statusRow.className = "status-row";
  STATUS_PIPELINE.forEach(s => {
    const chip = document.createElement("button");
    chip.className = "status-chip" + (o.status === s ? " current" : "");
    chip.textContent = s;
    chip.addEventListener("click", () => updateStatus(o.id, s));
    statusRow.appendChild(chip);
  });
  card.appendChild(statusRow);

  return card;
}

async function updateStatus(id, status){
  try{
    const res = await fetch(apiUrl("/api/orders/" + id), {
      method: "PATCH",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + getAdminToken() },
      body: JSON.stringify({ status })
    });
    if(!res.ok) throw new Error("failed");
    loadOrders();
  }catch(e){
    alert("Could not update order status — check the server connection and admin token.");
  }
}

document.getElementById("refreshBtn").addEventListener("click", loadOrders);
loadOrders();
</script>
</body>
</html>
