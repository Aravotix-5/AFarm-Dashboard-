<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>A Farm — Orders</title>
<link rel="stylesheet" href="styles.css">
<style>
  body{ padding-top:20px; padding-bottom:40px; max-width:720px; margin:0 auto; }
  .admin-header{ padding:0 20px 12px; }
  .admin-header h1{ font-size:26px; }
  .order-card{
    margin:0 20px 14px; padding:16px; border:1px solid var(--line);
    border-radius:var(--radius-md); background:var(--card); box-shadow:var(--shadow-sm);
  }
  .order-card-top{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; }
  .order-id{ font-family:'Fraunces',serif; font-weight:700; font-size:18px; }
  .order-total{ font-weight:700; }
  .order-meta{ font-size:12.5px; color:var(--ink-soft); margin:2px 0 8px; }
  .order-items{ font-size:14px; margin-bottom:10px; }
  .status-row{ display:flex; gap:6px; flex-wrap:wrap; }
  .status-chip{
    padding:8px 12px; border-radius:999px; border:1px solid var(--line);
    background:var(--linen); font-size:12.5px; font-weight:600; cursor:pointer; color:var(--ink-soft);
  }
  .status-chip.current{ background:var(--ink); color:#fff; border-color:var(--ink); }
  .empty-note{ padding:0 20px; }
</style>
</head>
<body>
  <div class="admin-header">
    <h1>A Farm — Orders</h1>
    <p class="view-sub">Tap a status to move an order forward. This reads the order history saved in this browser's storage — open it on the same device/browser customers are ordering from.</p>
  </div>
  <div id="ordersList"></div>
  <p class="empty-note" id="emptyNote" hidden>No orders yet.</p>

<script>
const STATUS_PIPELINE = ["Order Received", "Preparing", "Ready", "Completed"];

function money(n){ return "$" + Number(n).toFixed(2); }

function loadAccount(){
  try{
    return JSON.parse(localStorage.getItem("afarm_account")) || { history: [] };
  }catch(e){
    return { history: [] };
  }
}
function saveAccount(account){
  localStorage.setItem("afarm_account", JSON.stringify(account));
}

function renderOrders(){
  const account = loadAccount();
  const list = document.getElementById("ordersList");
  const emptyNote = document.getElementById("emptyNote");
  list.innerHTML = "";
  const history = account.history || [];
  emptyNote.hidden = history.length > 0;
  history.forEach((o, index) => list.appendChild(buildOrderCard(o, index)));
}

function buildOrderCard(o, index){
  const card = document.createElement("div");
  card.className = "order-card";

  const top = document.createElement("div");
  top.className = "order-card-top";
  top.innerHTML = '<span class="order-id">Order #' + (o.orderId || index + 1) + '</span><span class="order-total">' + money(o.total) + '</span>';
  card.appendChild(top);

  const meta = document.createElement("div");
  meta.className = "order-meta";
  const when = new Date(o.date).toLocaleString();
  meta.textContent = when + " · +" + o.pointsEarned + " pts";
  card.appendChild(meta);

  const items = document.createElement("div");
  items.className = "order-items";
  items.textContent = o.items;
  card.appendChild(items);

  const statusRow = document.createElement("div");
  statusRow.className = "status-row";
  const currentStatus = o.status || "Order Received";
  STATUS_PIPELINE.forEach(s => {
    const chip = document.createElement("button");
    chip.className = "status-chip" + (currentStatus === s ? " current" : "");
    chip.textContent = s;
    chip.addEventListener("click", () => updateStatus(index, s));
    statusRow.appendChild(chip);
  });
  card.appendChild(statusRow);

  return card;
}

function updateStatus(index, status){
  const account = loadAccount();
  if(!account.history || !account.history[index]) return;
  account.history[index].status = status;
  saveAccount(account);
  renderOrders();
}

renderOrders();
</script>
</body>
</html>
